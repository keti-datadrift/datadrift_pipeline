[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [".runtime", ".venv", "node_modules", ".next", "dist"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "BLE", "PLC0414", "PLW1510", "RUF059", "RUF100"]

[tool.ruff.format]
docstring-code-format = true
